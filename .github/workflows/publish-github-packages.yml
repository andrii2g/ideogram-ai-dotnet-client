name: Publish NuGet Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "NuGet package version 1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.package_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Package version could not be resolved." >&2
            exit 1
          fi

          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore IdeogramV3DotNet.slnx

      - name: Build
        run: dotnet build IdeogramV3DotNet.slnx --configuration Release --no-restore

      - name: Pack library
        run: >
          dotnet pack src/Ideogram.Client/Ideogram.Client.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Add GitHub Packages source
        run: >
          dotnet nuget add source
          --username andrii2g
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text
          --name github
          https://nuget.pkg.github.com/andrii2g/index.json

      - name: Publish package
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source github
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
