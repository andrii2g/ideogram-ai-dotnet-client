name: Publish NuGet Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "Optional explicit package version, for example 1.0.1"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' src/Ideogram.Client/Ideogram.Client.csproj)"

          if [ -z "$BASE_VERSION" ]; then
            echo "Base package version could not be resolved from VersionPrefix." >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.package_version }}" ]; then
            VERSION="${{ inputs.package_version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "Resolved package version: $VERSION"
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Ideogram.slnx

      - name: Build
        run: dotnet build Ideogram.slnx --configuration Release --no-restore

      - name: Pack library
        run: >
          dotnet pack src/Ideogram.Client/Ideogram.Client.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Add GitHub Packages source
        run: >
          dotnet nuget add source
          --username andrii2g
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text
          --name github
          https://nuget.pkg.github.com/andrii2g/index.json

      - name: Publish package
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source github
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
